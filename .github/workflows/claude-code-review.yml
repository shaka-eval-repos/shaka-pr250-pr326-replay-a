name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            CHECKOUT SHA: ${{ github.sha }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            The checkout is GitHub's integration commit for this PR head and base.
            Inspect that checkout and label feedback with the supplied head SHA.
            If the live PR head changes, report this review as stale.
            Finish with one top-level comment identifying the head and checkout SHAs,
            with a findings count or "no findings", even when there are no problems.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Runner success is not proof of review. Workflow edits can safely skip
      # the action; expose that gap, while malformed/failed executions fail.
      - name: Report Claude review availability
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          unavailable() {
            printf '## Claude review\n\n**UNAVAILABLE** for %s. %s\n' "$REVIEW_HEAD" "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::$2::Claude review UNAVAILABLE: $1"
          }
          if [ "$REVIEW_OUTCOME" != "success" ]; then
            unavailable "The review action did not complete. Inspect its error before retrying." error
            exit 1
          fi
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            unavailable "No execution evidence. The action may have safely skipped a workflow change; confirm the cause. A required review still needs completion, for example through an authorized CLI review." warning
            exit 0
          fi
          if ! jq -e -s '
            flatten | map(select(type == "object" and .type == "result")) | last |
            select(.subtype == "success" and .is_error == false and
                   (.num_turns | type == "number") and .num_turns > 0)
          ' "$EXECUTION_FILE" > /dev/null 2>&1; then
            unavailable "Execution is missing, malformed, failed, or incomplete. Read the action output; do not count this as a completed review." error
            exit 1
          fi
          printf '## Claude review\n\n**UNVERIFIED** for %s. Claude execution succeeded. The owner must verify a visible PR report for this revision and address its findings before marking review complete.\n' "$REVIEW_HEAD" >> "$GITHUB_STEP_SUMMARY"
